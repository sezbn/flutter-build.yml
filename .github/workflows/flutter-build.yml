name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Reconstruct missing Android files
        run: flutter create . --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Force compileSdk 36 (app + plugins)
        run: |
          FILES=$(find android "$HOME/.pub-cache/hosted" -maxdepth 6 \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -path "*android*" 2>/dev/null)
          for f in $FILES; do
            sed -i -E 's/compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*[0-9]+/compileSdk = 36/' "$f"
          done
          echo "Fichiers modifiés :"
          grep -rn "compileSdk" $FILES || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
