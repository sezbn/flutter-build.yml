name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Reconstruct missing Android files
        run: flutter create . --platforms=android

      - name: Force compileSdk and targetSdk to 34
        run: |
          # On s'assure que le fichier build.gradle existe et on force la version 34
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' "$BUILD_FILE"
            sed -i 's/compileSdk.*/compileSdk = 34/g' "$BUILD_FILE"
            sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' "$BUILD_FILE"
            sed -i 's/targetSdk.*/targetSdk = 34/g' "$BUILD_FILE"
          fi

          BUILD_KTS="android/app/build.gradle.kts"
          if [ -f "$BUILD_KTS" ]; then
            sed -i 's/compileSdk =.*/compileSdk = 34/g' "$BUILD_KTS"
            sed -i 's/targetSdk =.*/targetSdk = 34/g' "$BUILD_KTS"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
