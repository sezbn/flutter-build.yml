name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Reconstruct missing Android files
        run: flutter create . --platforms=android

      - name: Force compileSdk and targetSdk to 34
        run: |
          # Méthode radicale : écriture directe dans android/app/build.gradle
          # On remplace toute ligne définissant compileSdk ou targetSdk par la version 34
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdk.*/compileSdk = 34/g' android/app/build.gradle
            sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle
            sed -i 's/targetSdk.*/targetSdk = 34/g' android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk =.*/compileSdk = 34/g' android/app/build.gradle.kts
            sed -i 's/targetSdk =.*/targetSdk = 34/g' android/app/build.gradle.kts
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
